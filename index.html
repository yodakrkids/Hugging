<title>허깅 일산점 3D</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,500;1,600&family=Gaegu:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: full-bleed WebGL stage; a quiet name plate top-left, view presets docked bottom. Single committed look (the cafe's own velvet brown + sage). */
:root{
  --velvet:#241813;        /* counter cladding */
  --velvet-2:#3a2820;
  --sage:#c9cfa6;          /* wall paint */
  --paper:#f3efe2;         /* table tops, cards */
  --walnut:#a8683f;        /* worktop, accent */
  --ink-soft:rgba(243,239,226,.68);
  --font-display:"Cormorant Garamond","Nanum Myeongjo",Georgia,serif;
  --font-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--velvet);color:var(--paper);font-family:var(--font-body);overflow:hidden}
#stage{position:fixed;inset:0;display:block;width:100%;height:100%;touch-action:none;outline:none}
.plate{position:fixed;top:0;left:0;
  padding-top:calc(env(safe-area-inset-top,0px) + 14px);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  pointer-events:none;display:flex;flex-direction:column;gap:2px;text-shadow:0 1px 10px rgba(0,0,0,.55)}
.plate h1{margin:0;font-family:var(--font-display);font-style:italic;font-weight:600;font-size:clamp(26px,4.2vw,40px);line-height:1;letter-spacing:.01em}
.plate p{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
.dock{position:fixed;left:0;right:0;bottom:0;
  padding-bottom:calc(env(safe-area-inset-bottom,0px) + 12px);
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-direction:column;align-items:center;gap:8px;pointer-events:none}
.views{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;pointer-events:auto;max-width:100%}
.views button{font:500 13px/1 var(--font-body);color:var(--paper);background:rgba(36,24,19,.72);
  border:1px solid rgba(243,239,226,.22);border-radius:2px;padding:9px 12px;cursor:pointer;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);transition:background .15s,border-color .15s}
.views button:hover{background:var(--velvet-2);border-color:rgba(243,239,226,.5)}
.views button:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.views button[aria-pressed="true"]{background:var(--sage);color:var(--velvet);border-color:var(--sage)}
.ao{position:fixed;top:calc(env(safe-area-inset-top,0px) + 14px);right:max(16px,env(safe-area-inset-right,0px));
  font:500 13px/1 var(--font-body);color:var(--paper);background:rgba(36,24,19,.72);border:1px solid rgba(243,239,226,.22);
  border-radius:2px;padding:9px 12px;cursor:pointer;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.ao:hover{background:var(--velvet-2);border-color:rgba(243,239,226,.5)}
.ao:focus-visible{outline:2px solid var(--sage);outline-offset:2px}
.hint{margin:0;font-size:11.5px;color:var(--ink-soft);text-shadow:0 1px 8px rgba(0,0,0,.6);text-align:center}
[hidden]{display:none!important}
#fail{position:fixed;inset:0;display:grid;place-items:center;padding:24px;text-align:center;background:var(--velvet);color:var(--paper)}
@media (prefers-reduced-motion:reduce){.views button{transition:none}}
</style>

<canvas id="stage" tabindex="0" aria-label="로스팅하우스 허깅 일산점 실내 3D 모델"></canvas>
<header class="plate">
  <h1>Roasting House Hugging</h1>
  <p>일산점 · 실내 3D 모델</p>
</header>
<div class="dock">
  <div class="views" id="views" role="group" aria-label="시점"></div>
  <p class="hint">드래그 회전 · 휠/핀치 줌 · 우클릭(두 손가락) 이동</p>
</div>
<button type="button" id="ao" class="ao">AO 켬</button>
<div id="fail" hidden>WebGL을 사용할 수 없어 3D 모델을 표시하지 못했습니다. 하드웨어 가속이 켜진 브라우저에서 다시 열어 주세요.</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.147.0/examples/js/environments/RoomEnvironment.js"></script>
<script>
(async function () {
'use strict';
const canvas = document.getElementById('stage');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
} catch (e) { document.getElementById('fail').hidden = false; return; }

// ---------- room dimensions (m) ----------
const X0 = -4.8, X1 = 6.6, Z0 = -5.4, Z1 = 5.0, H = 3.0;
const CT = 1.09;          // front counter top (incl. worktop)
const BT = 0.94;          // back counter top

renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.LinearEncoding;      // post shader does ACES + sRGB
renderer.toneMapping = THREE.NoToneMapping;
const EXPOSURE = 0.86;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x241813);
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new THREE.RoomEnvironment(), 0.04).texture;

const camera = new THREE.PerspectiveCamera(58, 1, 0.05, 80);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 0.4; controls.maxDistance = 24;
controls.maxPolarAngle = Math.PI / 2 - 0.02;

try { await Promise.race([
  Promise.all([document.fonts.load('italic 600 40px "Cormorant Garamond"'), document.fonts.load('700 30px "Gaegu"'), document.fonts.load('500 20px "IBM Plex Sans KR"')]),
  new Promise(r => setTimeout(r, 2500))]); } catch (e) {}

// ---------- helpers ----------
const rnd = (() => { let s = 20261126; return () => (s = (s * 1664525 + 1013904223) >>> 0) / 4294967296; })();
function tex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.encoding = THREE.sRGBEncoding;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(repeat[0], repeat[1]); }
  return t;
}
const std = (o) => new THREE.MeshStandardMaterial(o);
// glossy accents: flagged so the matte clamp below leaves them alone
const shiny = (o) => { const m = new THREE.MeshPhysicalMaterial(o); m.userData.shiny = true; return m; };
function add(mesh, parent, shadow) {
  if (shadow !== false) { mesh.castShadow = true; mesh.receiveShadow = true; }
  (parent || scene).add(mesh); return mesh;
}
function box(w, h, d, mat, x, y, z, parent, shadow) {       // y = bottom
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); m.position.set(x, y + h / 2, z); return add(m, parent, shadow);
}
function boxR(x0, x1, y0, y1, z0, z1, mat, parent, shadow) {
  return box(x1 - x0, y1 - y0, z1 - z0, mat, (x0 + x1) / 2, y0, (z0 + z1) / 2, parent, shadow);
}
function cyl(rt, rb, h, mat, x, y, z, parent, seg, open) {  // y = bottom
  const m = new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 20, 1, !!open), mat); m.position.set(x, y + h / 2, z); return add(m, parent);
}
function plane(w, h, mat, x, y, z, ry, parent) {            // y = centre
  const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat); m.position.set(x, y, z); m.rotation.y = ry || 0; (parent || scene).add(m); return m;
}
function group(x, y, z, ry, parent) { const g = new THREE.Group(); g.position.set(x, y, z); g.rotation.y = ry || 0; (parent || scene).add(g); return g; }
function roundedRect(w, d, r) {
  const s = new THREE.Shape(), x = -w / 2, y = -d / 2;
  s.moveTo(x + r, y); s.lineTo(x + w - r, y); s.quadraticCurveTo(x + w, y, x + w, y + r);
  s.lineTo(x + w, y + d - r); s.quadraticCurveTo(x + w, y + d, x + w - r, y + d);
  s.lineTo(x + r, y + d); s.quadraticCurveTo(x, y + d, x, y + d - r);
  s.lineTo(x, y + r); s.quadraticCurveTo(x, y, x + r, y); return s;
}

// ---------- textures ----------
const tFloor = tex(512, 512, (g, w, h) => {
  g.fillStyle = '#b5a78f'; g.fillRect(0, 0, w, h);
  const cols = ['#8f8168', '#cfc4ad', '#a09078', '#ddd4c0', '#7d705b', '#c2b59c'];
  for (let i = 0; i < 16000; i++) { g.fillStyle = cols[(rnd() * cols.length) | 0]; const s = 1 + rnd() * 1.8; g.fillRect(rnd() * w, rnd() * h, s, s); }
}, [7, 7]);
const tVelvet = tex(512, 512, (g, w, h) => {
  g.fillStyle = '#2b1a14'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 260; i++) {
    const x = rnd() * w, y = rnd() * h, r = 20 + rnd() * 70, gr = g.createRadialGradient(x, y, 0, x, y, r);
    const c = rnd() > .5 ? '74,46,36' : '20,12,9'; gr.addColorStop(0, `rgba(${c},.22)`); gr.addColorStop(1, `rgba(${c},0)`);
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
}, [1.5, 1.5]);
const tWood = tex(512, 256, (g, w, h) => {
  g.fillStyle = '#6d3f29'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 420; i++) {
    g.strokeStyle = `rgba(${rnd() > .5 ? '40,20,12' : '150,92,58'},${.08 + rnd() * .22})`; g.lineWidth = .6 + rnd() * 2.2;
    const y = rnd() * h; g.beginPath(); g.moveTo(0, y); g.bezierCurveTo(w * .3, y + rnd() * 8 - 4, w * .7, y + rnd() * 8 - 4, w, y + rnd() * 6 - 3); g.stroke();
  }
}, [2, 1]);
const tWall = tex(256, 256, (g, w, h) => {
  g.fillStyle = '#c9cea8'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 900; i++) { g.fillStyle = `rgba(${rnd() > .5 ? '255,255,235' : '120,128,90'},${rnd() * .06})`; const s = 4 + rnd() * 26; g.fillRect(rnd() * w, rnd() * h, s, s * (.3 + rnd())); }
}, [5, 2]);
const tChina = tex(128, 64, (g, w, h) => {
  g.fillStyle = '#f7f5ef'; g.fillRect(0, 0, w, h);
  const cols = ['#c9566b', '#6a7fb8', '#d99ab0', '#5f8a5a', '#8d5aa0'];
  for (let i = 0; i < 70; i++) { g.fillStyle = cols[(rnd() * cols.length) | 0]; g.beginPath(); g.arc(rnd() * w, rnd() * h, 1.5 + rnd() * 3.5, 0, 7); g.fill(); }
  g.fillStyle = '#c7a24a'; g.fillRect(0, 0, w, 3);
}, [3, 1]);

// ---------- materials ----------
const M = {
  // matte base
  wall: std({ map: tWall, roughness: 1 }),
  floor: std({ map: tFloor, roughness: 1 }),
  velvet: std({ map: tVelvet, roughness: 1 }),
  wood: std({ map: tWood, roughness: .82 }),
  woodLight: std({ color: 0xc19462, roughness: .8 }),
  woodPale: std({ color: 0xe2c9a0, roughness: .9 }),
  white: std({ color: 0xf2efe6, roughness: .85 }),
  pipe: std({ color: 0xdfe2c6, roughness: 1 }),
  black: std({ color: 0x161616, roughness: .9 }),
  rubber: std({ color: 0x0e0e0e, roughness: 1 }),
  seatGreen: std({ color: 0x3d4b45, roughness: 1 }),
  seatCream: std({ color: 0xe6dfcc, roughness: 1 }),
  cream: std({ color: 0xebe4d0, roughness: .9 }),
  concrete: std({ color: 0xbdb9ae, roughness: 1 }),
  leaf: std({ color: 0x4e5a3a, roughness: .9, side: THREE.DoubleSide }),
  // glossy accents
  chrome: shiny({ color: 0xf2f2f2, metalness: 1, roughness: .04, envMapIntensity: 1.7 }),
  steel: shiny({ color: 0xd0d2d2, metalness: 1, roughness: .2, envMapIntensity: 1.35 }),
  glass: shiny({ color: 0xffffff, transparent: true, opacity: .12, roughness: .02, metalness: 0, depthWrite: false, envMapIntensity: .45 }),
  ceramic: shiny({ color: 0xf7f4ec, roughness: .22, clearcoat: 1, clearcoatRoughness: .04, envMapIntensity: 1.1, side: THREE.DoubleSide }),
  china: shiny({ map: tChina, roughness: .18, clearcoat: 1, clearcoatRoughness: .03, envMapIntensity: 1.2 }),
  terracotta: shiny({ color: 0xb4582f, roughness: .3, clearcoat: .9, clearcoatRoughness: .08, envMapIntensity: 1.0 }),
  beans: shiny({ color: 0x2a170f, roughness: .32, envMapIntensity: .9 }),
  gloss: shiny({ color: 0x0c0c0c, roughness: .18, clearcoat: .6, clearcoatRoughness: .08, envMapIntensity: .7 }),
  glow: new THREE.MeshBasicMaterial({ color: 0xffffff }),
  warmGlow: new THREE.MeshBasicMaterial({ color: 0xffd9a0 }),
};

// ---------- shell ----------
const shell = new THREE.Group(); scene.add(shell);
const ceilingKit = new THREE.Group(); scene.add(ceilingKit);
{
  const w = X1 - X0, d = Z1 - Z0, cx = (X0 + X1) / 2, cz = (Z0 + Z1) / 2;
  const fl = new THREE.Mesh(new THREE.PlaneGeometry(w, d), M.floor); fl.rotation.x = -Math.PI / 2; fl.position.set(cx, 0, cz); fl.receiveShadow = true; shell.add(fl);
  const ce = new THREE.Mesh(new THREE.PlaneGeometry(w, d), M.wall); ce.rotation.x = Math.PI / 2; ce.position.set(cx, H, cz); shell.add(ce);
  const mk = (pw, x, z, ry) => { const m = plane(pw, H, M.wall, x, H / 2, z, ry, shell); m.receiveShadow = true; };
  mk(w, cx, Z0, 0); mk(w, cx, Z1, Math.PI); mk(d, X0, cz, Math.PI / 2); mk(d, X1, cz, -Math.PI / 2);

  // beams, soffit, pipes
  box(.6, .42, d, M.wall, -.9, H - .42, cz, ceilingKit, false);
  box(w, .3, .45, M.wall, cx, H - .3, -3.55, ceilingKit, false);
  const pz = (x, y, r) => { const m = cyl(r, r, d, M.pipe, x, 0, cz, ceilingKit, 12); m.rotation.x = Math.PI / 2; m.position.y = y; m.castShadow = false; };
  pz(.15, H - .1, .045); pz(.32, H - .1, .045); pz(-3.2, H - .08, .03);
  const px = (z, y, r, x0, x1) => { const m = cyl(r, r, x1 - x0, M.pipe, (x0 + x1) / 2, 0, z, ceilingKit, 12); m.rotation.z = Math.PI / 2; m.position.y = y; m.castShadow = false; };
  px(-3.0, H - .16, .05, -.6, X1); px(-2.85, H - .42, .035, .2, 3.4); px(1.2, H - .09, .03, -.6, X1);

  // cassette air conditioner
  box(.84, .26, .84, std({ color: 0x8d9388, roughness: .7 }), 4.3, H - .34, .6, ceilingKit, false);
  box(.96, .04, .96, M.white, 4.3, H - .38, .6, ceilingKit, false);
  for (const [dx, dz, sw, sd] of [[0, .4, .6, .05], [0, -.4, .6, .05], [.4, 0, .05, .6], [-.4, 0, .05, .6]]) box(sw, .01, sd, M.black, 4.3 + dx, H - .39, .6 + dz, ceilingKit, false);
  cyl(.02, .02, .08, M.steel, 4.0, H - .08, .3, ceilingKit, 8); cyl(.02, .02, .08, M.steel, 4.6, H - .08, .9, ceilingKit, 8);

  // track lighting: black rails hung below the slab, white spots
  const ty = H - .3;
  const spot = (x, z, tx, ty2, tz) => {
    const g = new THREE.Group(); g.position.set(x, ty - .05, z); ceilingKit.add(g);
    const s = new THREE.Mesh(new THREE.CylinderGeometry(.042, .042, .12, 16), M.white); s.rotation.x = Math.PI / 2; g.add(s);
    const l = new THREE.Mesh(new THREE.CircleGeometry(.034, 16), M.warmGlow); l.position.z = .061; g.add(l);
    g.lookAt(tx, ty2, tz);
  };
  const rail = (x0, x1, z0, z1) => {
    const t = .035;
    boxR(x0, x1, ty, ty + t, z0 - t / 2, z0 + t / 2, M.black, ceilingKit, false); boxR(x0, x1, ty, ty + t, z1 - t / 2, z1 + t / 2, M.black, ceilingKit, false);
    boxR(x0 - t / 2, x0 + t / 2, ty, ty + t, z0, z1, M.black, ceilingKit, false); boxR(x1 - t / 2, x1 + t / 2, ty, ty + t, z0, z1, M.black, ceilingKit, false);
    for (const [x, z] of [[x0, z0], [x1, z0], [x0, z1], [x1, z1], [(x0 + x1) / 2, z0], [(x0 + x1) / 2, z1]]) cyl(.006, .006, H - ty - t, M.steel, x, ty + t, z, ceilingKit, 6);
  };
  rail(-4.3, -1.5, -2.6, 3.9); rail(.1, 5.9, -2.2, 3.9);
  for (const z of [-1.8, -.2, 1.6, 3.2]) spot(-4.3, z, -4.2, .6, z + .2);
  for (const x of [-3.6, -2.4]) spot(x, -2.6, x + .2, 1.1, -3.4);
  for (const x of [.6, 1.9, 3.3, 4.8]) spot(x, -2.2, x, 1.0, -3.2);
  for (const z of [-.6, 1.2, 3.0]) { spot(5.9, z, 5.2, .5, z); spot(.1, z, .8, .5, z + .4); }
  for (const x of [-3.2, -2.2]) spot(x, 3.9, x, .7, 3.2);

  // windows with roller blinds (right wall)
  const tBlind = tex(64, 256, (g, w2, h2) => {
    g.fillStyle = '#fbf8ee'; g.fillRect(0, 0, w2, h2);
    for (let y = 0; y < h2; y += 8) { g.fillStyle = 'rgba(190,186,168,.55)'; g.fillRect(0, y, w2, 1); }
    g.fillStyle = 'rgba(255,255,255,.6)'; g.fillRect(0, h2 * .72, w2, h2 * .28);
  });
  const mBlind = new THREE.MeshBasicMaterial({ map: tBlind });
  for (const [z0, z1] of [[-4.6, -1.7], [-.2, 4.2]]) {
    const wz = z1 - z0, n = Math.round(wz / 1.45);
    for (let i = 0; i < n; i++) plane(wz / n - .06, 1.7, mBlind, X1 - .02, 1.75, z0 + (i + .5) * wz / n, -Math.PI / 2, shell);
    boxR(X1 - .06, X1, .86, .9, z0 - .05, z1 + .05, M.white, shell, false); boxR(X1 - .06, X1, 2.6, 2.64, z0 - .05, z1 + .05, M.white, shell, false);
  }
}

// ---------- dark velvet volumes ----------
boxR(X0, -3.6, 0, 2.8, Z0, -3.4, M.velvet);                 // back room, tall
boxR(-3.6, -2.4, 0, 2.75, Z0, -4.1, M.velvet);              // recessed tall block
plane(.62, .95, std({ color: 0xf2efe4, roughness: .9, side: THREE.DoubleSide }), -3.0, 1.85, -4.085, 0); // noren curtain
boxR(-3.3, -2.7, 2.33, 2.36, -4.09, -4.06, M.black);
boxR(-3.6, -2.4, 0, 1.7, -3.4, -2.2, M.velvet);             // tall screen at counter end
boxR(-2.4, 1.15, 0, CT - .04, -2.9, -2.2, M.velvet);        // service counter
boxR(-2.4, -1.08, 0, CT - .04, -2.2, -2.1, M.velvet);       // stepped-out left bay
boxR(-2.42, 1.17, CT - .04, CT, -2.92, -2.1, M.wood);       // walnut worktop
boxR(2.5, 3.9, 0, 1.05, -2.9, -2.2, M.velvet);              // menu block
// warm glow washing the floor under the counter front
boxR(-2.38, 1.13, .0, .012, -2.09, -2.05, M.warmGlow, scene, false);

// ---------- back counter: under-counter fridges + walnut top ----------
{
  boxR(-2.2, 4.6, .1, BT - .04, -5.38, -4.75, M.steel);
  boxR(-2.2, 4.6, 0, .1, -5.34, -4.8, M.black);
  boxR(-2.22, 4.62, BT - .04, BT, -5.4, -4.72, M.wood);
  for (let x = -2.2; x <= 4.61; x += .85) boxR(x - .004, x + .004, .12, BT - .1, -4.752, -4.746, M.black, scene, false);
  boxR(-2.2, 4.6, BT - .1, BT - .085, -4.752, -4.74, M.black, scene, false);
  // tall fridge + shelf wall behind the cup shelf
  boxR(-2.15, -1.4, BT, 2.0, -5.36, -4.8, M.steel);
  boxR(-1.78, -1.772, BT + .05, 1.95, -4.8, -4.795, M.black, scene, false);
}

// ---------- seating ----------
function chair(x, z, ry, seatMat) {
  const g = group(x, 0, z, ry);
  cyl(.21, .2, .05, seatMat, 0, .43, 0, g, 24);
  for (const [dx, dz] of [[.15, .15], [-.15, .15], [.15, -.15], [-.15, -.15]]) { const l = cyl(.011, .011, .44, M.chrome, dx * 1.12, 0, dz * 1.12, g, 8); l.rotation.z = -dx * .25; l.rotation.x = dz * .25; }
